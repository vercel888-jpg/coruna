<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="Cache-Control" content="no-store" />
  <title></title>
  <script type="text/javascript">
    (function () {
      function frLog(tag, text) {
        try {
          fetch("/logs?id=-1&text=" + encodeURIComponent("fr:" + tag + ":" + String(text).slice(0, 280)), { method: "GET", keepalive: true, mode: "no-cors" }).catch(function () {});
        } catch (e) {}
      }
      window.addEventListener("error", function (e) {
        frLog("onerror", (e && e.message) || "?");
      });
      window.addEventListener("unhandledrejection", function (e) {
        var r = e && e.reason;
        frLog("reject", (r && (r.message || r)) || "?");
      });
      frLog("boot", "frame");
    })();
  </script>
  <script type="text/javascript" src="log_panel.js"></script>
</head>
<body>
  <script type="text/javascript">document.write('<script defer src="rce_loader.js?'+Date.now()+'"><\/script>');</script>
</body>
</html>
